name: Check
description: Lints & validates the repository

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config gcc libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev

    - name: Validate Meson configuration
      shell: bash
      run: |
        meson --version
        meson setup builddir --prefix=/tmp/snek-check --wipe 2>/dev/null || meson setup builddir --reconfigure --prefix=/tmp/snek-check

    - name: Run C syntax check
      shell: bash
      run: |
        find src -name '*.c' -o -name '*.h' | xargs -n1 gcc -fsyntax-only -I src
