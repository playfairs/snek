name: Checks and Build
on:
  push:
  pull_request:
jobs:
  build-linux:
    name: Build Linux package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build package
        run: nix build -L

      - name: Bundle Linux artifact
        run: |
          mkdir -p dist/package
          cp -L result/bin/* dist/package/
          cp -r assets dist/package/
          tar -czf dist/snek-linux.tar.gz -C dist/package .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snek-linux-package
          path: dist/snek-linux.tar.gz

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install meson ninja pkg-config sdl2 sdl2_ttf sdl2_mixer

      - name: Build macOS binary
        run: |
          meson setup builddir --buildtype=release
          meson compile -C builddir
          mkdir -p dist/package
          cp builddir/snek dist/package/
          cp -r assets dist/package/
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile
          root = pathlib.Path('dist')
          with zipfile.ZipFile(root / 'snek-macos.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted((root / 'package').rglob('*')):
                  if path.is_file():
                      zf.write(path, str(path.relative_to(root)))
          PY

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snek-macos-package
          path: dist/snek-macos.zip

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-python
            make

      - name: Build Windows binary
        shell: msys2 {0}
        run: |
          meson setup builddir --buildtype=release
          meson compile -C builddir
          mkdir -p dist/package
          cp builddir/snek.exe dist/package/
          cp -r assets dist/package/
          python3 - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path('dist')
          with zipfile.ZipFile(root / 'snek-windows.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted((root / 'package').rglob('*')):
                  if path.is_file():
                      zf.write(path, str(path.relative_to(root)))
          PY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snek-windows-package
          path: dist/snek-windows.zip
