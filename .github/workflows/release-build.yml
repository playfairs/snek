name: Build Packages

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-linux-static:
    name: Build Linux static tar.gz
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Read version
        id: version
        run: |
          APP_VERSION="$(grep -A5 '^\[project\]' version.toml | grep '^version' | sed -E 's/.*=\s*"([^"]+)".*/\1/')"
          test -n "$APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux static release
        run: make clean linux-static

      - name: Package Linux static release
        run: |
          mkdir -p dist linux-release
          cp build/snek linux-release/snek
          cp -R assets linux-release/assets
          cp README.md linux-release/README.txt
          tar -czf "dist/Snek-linux-${{ steps.version.outputs.app_version }}.tar.gz" -C linux-release .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Snek-linux-static-tarball
          path: dist/Snek-linux-${{ steps.version.outputs.app_version }}.tar.gz
          if-no-files-found: error

      - name: Upload Linux package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          upload_url="${UPLOAD_URL%\{*}"
          curl -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @"dist/Snek-linux-${{ steps.version.outputs.app_version }}.tar.gz" \
            "$upload_url?name=Snek-linux-${{ steps.version.outputs.app_version }}.tar.gz"

  build-pkg:
    name: Build macOS PKG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf sdl2_mixer pkg-config

      - name: Read version
        id: version
        run: |
          APP_VERSION="$(grep -A5 '^\[project\]' version.toml | grep '^version' | sed -E 's/.*=\s*"([^"]+)".*/\1/')"
          test -n "$APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release app
        run: make clean release

      - name: Create app bundle
        run: |
          APP_VERSION="${{ steps.version.outputs.app_version }}"
          APP_ROOT="package/Snek.app"
          mkdir -p "$APP_ROOT/Contents/MacOS" "$APP_ROOT/Contents/Resources" "$APP_ROOT/Contents/Frameworks"
          cp build/snek "$APP_ROOT/Contents/Resources/snek-bin"
          cp -R assets "$APP_ROOT/Contents/Resources/assets"

          cat > "$APP_ROOT/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Snek</string>
            <key>CFBundleIdentifier</key>
            <string>dev.snek.game</string>
            <key>CFBundleName</key>
            <string>Snek</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$APP_VERSION</string>
            <key>CFBundleVersion</key>
            <string>$APP_VERSION</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$APP_ROOT/Contents/MacOS/Snek" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")/../Resources" || exit 1
          exec ./snek-bin
          SH

          chmod +x "$APP_ROOT/Contents/MacOS/Snek" "$APP_ROOT/Contents/Resources/snek-bin"

      - name: Bundle SDL dylibs into app
        run: |
          APP_ROOT="package/Snek.app"
          BIN="$APP_ROOT/Contents/Resources/snek-bin"
          FRAMEWORKS="$APP_ROOT/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          find_deps() {
            otool -L "$1" | tail -n +2 | awk '{print $1}' | grep -E '^(\/opt\/homebrew|\/usr\/local)\/.*\.dylib$' || true
          }

          copy_lib() {
            libpath="$1"
            dest="$FRAMEWORKS/$(basename "$libpath")"
            if [ ! -f "$dest" ]; then
              cp "$libpath" "$dest"
              install_name_tool -id "@rpath/$(basename "$libpath")" "$dest"
              for dep in $(find_deps "$dest"); do
                if echo "$dep" | grep -E '^(\/opt\/homebrew|\/usr\/local)\/.*\.dylib$' >/dev/null; then
                  copy_lib "$dep"
                  install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dest"
                fi
              done
            fi
          }

          for dep in $(find_deps "$BIN"); do
            copy_lib "$dep"
            install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$BIN"
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN"

      - name: Build PKG
        run: |
          mkdir -p dist
          pkgbuild \
            --component package/Snek.app \
            --install-location /Applications \
            --identifier dev.snek.game \
            --version "${{ steps.version.outputs.app_version }}" \
            dist/Snek.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: Snek-macOS-pkg
          path: dist/Snek.pkg
          if-no-files-found: error

      - name: Upload PKG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          upload_url="${UPLOAD_URL%\{*}"
          curl -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist/Snek.pkg \
            "$upload_url?name=Snek.pkg"

  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf sdl2_mixer pkg-config

      - name: Read version
        id: version
        run: |
          APP_VERSION="$(grep -A5 '^\[project\]' version.toml | grep '^version' | sed -E 's/.*=\s*"([^"]+)".*/\1/')"
          test -n "$APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release app
        run: make clean release

      - name: Create app bundle
        run: |
          APP_VERSION="${{ steps.version.outputs.app_version }}"
          APP_ROOT="package/Snek.app"
          mkdir -p "$APP_ROOT/Contents/MacOS" "$APP_ROOT/Contents/Resources" "$APP_ROOT/Contents/Frameworks"
          cp build/snek "$APP_ROOT/Contents/Resources/snek-bin"
          cp -R assets "$APP_ROOT/Contents/Resources/assets"

          cat > "$APP_ROOT/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Snek</string>
            <key>CFBundleIdentifier</key>
            <string>dev.snek.game</string>
            <key>CFBundleName</key>
            <string>Snek</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$APP_VERSION</string>
            <key>CFBundleVersion</key>
            <string>$APP_VERSION</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$APP_ROOT/Contents/MacOS/Snek" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")/../Resources" || exit 1
          exec ./snek-bin
          SH

          chmod +x "$APP_ROOT/Contents/MacOS/Snek" "$APP_ROOT/Contents/Resources/snek-bin"

      - name: Bundle SDL dylibs into app
        run: |
          APP_ROOT="package/Snek.app"
          BIN="$APP_ROOT/Contents/Resources/snek-bin"
          FRAMEWORKS="$APP_ROOT/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          find_deps() {
            otool -L "$1" | tail -n +2 | awk '{print $1}' | grep -E '^(\/opt\/homebrew|\/usr\/local)\/.*\.dylib$' || true
          }

          copy_lib() {
            libpath="$1"
            dest="$FRAMEWORKS/$(basename "$libpath")"
            if [ ! -f "$dest" ]; then
              cp "$libpath" "$dest"
              install_name_tool -id "@rpath/$(basename "$libpath")" "$dest"
              for dep in $(find_deps "$dest"); do
                if echo "$dep" | grep -E '^(\/opt\/homebrew|\/usr\/local)\/.*\.dylib$' >/dev/null; then
                  copy_lib "$dep"
                  install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dest"
                fi
              done
            fi
          }

          for dep in $(find_deps "$BIN"); do
            copy_lib "$dep"
            install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$BIN"
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN"

      - name: Build DMG
        run: |
          mkdir -p dist dmg-root
          cp -R package/Snek.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname Snek \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            dist/Snek.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Snek-macOS-dmg
          path: dist/Snek.dmg
          if-no-files-found: error

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          upload_url="${UPLOAD_URL%\{*}"
          curl -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist/Snek.dmg \
            "$upload_url?name=Snek.dmg"

  build-exe:
    name: Build Windows static ZIP
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer

      - name: Build Windows static release
        run: make clean windows

      - name: Create Windows release archive
        run: |
          mkdir -p dist
          zip -jr dist/Snek-windows.zip release/windows

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Snek-windows-zip
          path: dist/Snek-windows.zip
          if-no-files-found: error

      - name: Upload Windows package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          upload_url="${UPLOAD_URL%\{*}"
          curl -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @dist/Snek-windows.zip \
            "$upload_url?name=Snek-windows.zip"
