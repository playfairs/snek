name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version"
        required: true
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run check action
        uses: ./.github/actions/check

  build-linux:
    name: Build Linux package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y gcc meson ninja-build pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Build app
        run: |
          make clean all

      - name: Bundle SDL2 runtime
        run: |
          mkdir -p package/linux/bin package/linux/lib
          cp builddir/snek package/linux/bin/
          cp -r assets package/linux/
          for lib in $(ldd build/snek | awk '/libSDL2|libSDL2_ttf|libSDL2_mixer/ {print $3}' | sort -u); do
            if [ -n "$lib" ] && [ -f "$lib" ]; then
              cp "$lib" package/linux/lib/
            fi
          done
          cat > package/linux/run-snek.sh <<'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          exec "$DIR/bin/snek" "$@"
          EOF
          chmod +x package/linux/run-snek.sh

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          tar -czf dist/snek-linux.tar.gz -C package linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: snek-linux-package
          path: dist/snek-linux.tar.gz

  release:
    name: Publish release package
    needs: build-linux
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: snek-linux-package
          path: release-package

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: release-package/dist/snek-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
